<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — cherry</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/webp" href="assets/logo_icon.webp" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />



  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="admin-body">

  <!-- ============================================================ -->
  <!-- 1. LOGIN SCREEN -->
  <!-- ============================================================ -->
  <section class="admin-login-screen" id="admin-login-section">
    <div class="admin-login-card">
      <div class="admin-brand-header">
        <img src="assets/logo_icon.webp" alt="cherry" class="admin-brand-logo" width="56" height="56" decoding="async" />
        <h1 class="admin-brand-title">Admin Portal</h1>
        <p class="admin-brand-sub">cherry</p>
      </div>

      <form class="reservation-form" id="admin-login-form" novalidate>
        <div class="form-group">
          <input type="email" id="admin-email" class="form-input" placeholder=" " required autocomplete="username" />
          <label for="admin-email" class="form-label form-label--up">Admin Email</label>
          <span class="form-line"></span>
        </div>

        <div class="form-group">
          <input type="password" id="admin-password" class="form-input" placeholder=" " required
            autocomplete="current-password" />
          <label for="admin-password" class="form-label form-label--up">Password</label>
          <span class="form-line"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="admin-login-submit">
          <span class="btn-text">Log In to Portal</span>
        </button>
        <p style="font-size: 12px; color: var(--warm-gray); text-align: center; margin-top: 14px;">Demo Access Gate — Data stored in browser localStorage</p>
      </form>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 2. DASHBOARD VIEW (Hidden until Auth) -->
  <!-- ============================================================ -->
  <div id="admin-dashboard-section" hidden>

    <!-- Top Header Navigation -->
    <header class="admin-header">
      <div class="container admin-header-inner">
        <div class="admin-logo-group">
          <h2 class="admin-header-title">cherry</h2>
          <span class="admin-badge">Admin Dashboard</span>
        </div>
        <div class="admin-user-info">
          <span class="admin-email-text" id="logged-admin-email"></span>
          <button type="button" class="btn-logout" id="admin-logout-btn">Log Out</button>
        </div>
      </div>
    </header>

    <!-- Main Dashboard Content -->
    <main class="admin-main container">

      <!-- KPI Stats Grid -->
      <div class="admin-stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Total Reservations</span>
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zM16 2v4M8 2v4M3 10h18" />
            </svg>
          </div>
          <div class="stat-num" id="stat-total">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Pending Approval</span>
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </div>
          <div class="stat-num" id="stat-pending">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Confirmed Bookings</span>
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
          <div class="stat-num" id="stat-confirmed">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Total Guests Count</span>
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 00-3-3.87" />
              <path d="M16 3.13a4 4 0 010 7.75" />
            </svg>
          </div>
          <div class="stat-num" id="stat-guests">0</div>
        </div>
      </div>

      <!-- Controls: Filter Tabs, Search & Local Backup -->
      <div class="admin-controls-bar">
        <div class="admin-filter-group" role="tablist">
          <button type="button" class="admin-filter-tab active" data-filter="all">All Bookings</button>
          <button type="button" class="admin-filter-tab" data-filter="pending">Pending</button>
          <button type="button" class="admin-filter-tab" data-filter="confirmed">Confirmed</button>
          <button type="button" class="admin-filter-tab" data-filter="cancelled">Cancelled</button>
        </div>

        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <input type="text" id="admin-search" class="admin-search-input"
            placeholder="Search by guest name, email or phone..." />
          <button type="button" class="btn btn-outline" id="admin-export-btn" style="padding: 8px 14px; font-size: 12px; white-space: nowrap;">Export Reservations</button>
          <label class="btn btn-outline" style="padding: 8px 14px; font-size: 12px; white-space: nowrap; cursor: pointer; margin: 0; display: inline-flex; align-items: center;">
            Import Reservations
            <input type="file" id="admin-import-file" accept=".json" style="display: none;" />
          </label>
        </div>
      </div>

      <!-- Table Container -->
      <div class="admin-table-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Guest Details</th>
                <th>Date &amp; Time</th>
                <th>Guests</th>
                <th>Special Notes</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody">
              <tr>
                <td colspan="6" style="text-align:center; padding: 40px; color: var(--warm-gray);">
                  Loading reservations...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script type="module" src="admin.js"></script>
</body>

</html>
